name: Music Widget

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate music widget
        env:
          MUSIC_TOKEN: ${{ secrets.MUSIC_TOKEN }}
          YT_PLAYLIST_ID: PL7yCXuH9eCWmP_jSvjwPXjy_oTJmjvTeg
          YT_TRACK_COUNT: '5'
        run: python scripts/generate_music_widget.py

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.music.svg
          git diff --staged --quiet || git commit -m "chore(music): update widget [skip ci]"
          git push
